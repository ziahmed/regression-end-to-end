# Data Configuration
data:
  file_path: "data/data.csv"
  target_column: "final_test"
  test_size: 0.2
  random_state: 42

# Preprocessing
preprocessing:
  numeric_imputation_strategy: "median"
  categorical_imputation_strategy: "most_frequent"

# Models
models:
  linear_regression:
    enabled: true
  decision_tree:
    enabled: true
    max_depth: 15
  random_forest:
    enabled: true
    n_estimators: 100
    max_depth: 15

# Hyperparameter Tuning
grid_search:
  enabled: true
  cv_folds: 5
  scoring: "r2"
  param_grid:
    n_estimators: [50, 100, 200]
    max_depth: [10, 15, 20, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]

# At-Risk Threshold
risk_threshold: 50

# Output
output:
  model_path: "best_student_performance_model.pkl"
  metadata_path: "model_metadata.pkl"